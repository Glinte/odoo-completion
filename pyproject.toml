[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-completion"
version = "0.1.0"
description = "Checkout-aware Odoo command completion for Bash, Zsh, and Fish"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND LGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-ODOO", "COPYRIGHT-ODOO", "NOTICE"]
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
odoo-completion = "odoo_completion.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pexpect>=4.9", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
